<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1d3d">
<title>Offline • Aakar Co-op</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fdfcf5;color:#1a1a18;font-family:Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:16px}
  .card{max-width:380px;width:100%;background:#fff;border:1px solid #e8e2d1;border-radius:4px;padding:32px;text-align:center}
  .om{width:64px;height:64px;margin:0 auto;border-radius:50%;background:#0f1d3d;color:#d4af37;display:grid;place-items:center;font-size:34px;font-weight:700}
  h1{font-size:22px;margin:18px 0 6px} p{font-size:13px;color:#7a7568;line-height:1.6;margin:0}
  button{margin-top:22px;width:100%;padding:12px;border:0;border-radius:2px;background:#0f1d3d;color:#fff;font-size:12px;letter-spacing:.16em;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <div class="om">ॐ</div>
    <h1>You're offline</h1>
    <p>Aakar Co-op needs an internet connection to show society records. Check your Wi-Fi or mobile data and try again.</p>
    <button onclick="location.reload()">TRY AGAIN</button>
  </div>
</body>
</html>
